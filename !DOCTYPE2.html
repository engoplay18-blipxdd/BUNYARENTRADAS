<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRADA VERIFICADA - DISCOTECA BUNYAR 🌴</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --accent-gold: #ffd700;
            --success-green: #00ff88;
            --danger-red: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }

        .result-screen {
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: zoomIn 0.4s ease-out;
        }

        .screen-success {
            background: radial-gradient(circle, #0e3820 0%, #06170d 100%);
            border: 3px solid var(--success-green);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
        }

        .screen-error {
            background: radial-gradient(circle, #420f0f 0%, #1a0505 100%);
            border: 3px solid var(--danger-red);
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.3);
        }

        .status-title {
            font-size: 2em;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            margin: 20px 0;
            font-size: 1.05em;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-card p {
            margin: 8px 0;
        }

        .aforo-badge {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.1);
            border: 1px dashed var(--accent-gold);
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .brand-footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9em;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="resultBox" class="result-screen">
        <div id="statusTitle" class="status-title"></div>
        
        <div id="infoDetails" class="info-card"></div>

        <div class="brand-footer">
            DISCOTECA BUNYAR 🌴🍹<br>
            <small>Sistema de Control de Acceso</small>
        </div>
    </div>

    <script>
        // Obtener datos enviados desde el QR
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const name = urlParams.get('name');
        const dni = urlParams.get('dni');
        const zone = urlParams.get('zone');

        const resultBox = document.getElementById('resultBox');
        const statusTitle = document.getElementById('statusTitle');
        const infoDetails = document.getElementById('infoDetails');

        // Manejo del Aforo Usando almacenamiento local del navegador
        let aforoActual = parseInt(localStorage.getItem('bunyar_aforo') || '0');
        const AFORO_MAXIMO = 135;
        let ticketsUsados = JSON.parse(localStorage.getItem('bunyar_tickets') || '[]');

        if (code && name) {
            if (ticketsUsados.includes(code)) {
                // TICKET YA UTILIZADO
                resultBox.className = "result-screen screen-error";
                statusTitle.style.color = "var(--danger-red)";
                statusTitle.innerText = "⛔ ENTRADA YA USADA";

                infoDetails.innerHTML = `
                    <p><strong>Asistente:</strong> ${name}</p>
                    <p><strong>DNI:</strong> ${dni}</p>
                    <p><strong>Estado:</strong> RECHAZADO ❌</p>
                    <p style="color: var(--danger-red); margin-top: 10px;">Esta entrada ya fue escaneada anteriormente en puerta.</p>
                `;
            } else if (aforoActual >= AFORO_MAXIMO) {
                // AFORO LLENO
                resultBox.className = "result-screen screen-error";
                statusTitle.style.color = "var(--danger-red)";
                statusTitle.innerText = "🚫 AFORO COMPLETO";

                infoDetails.innerHTML = `
                    <p><strong>Capacidad:</strong> ${AFORO_MAXIMO} / ${AFORO_MAXIMO}</p>
                    <p style="color: var(--danger-red);">No se permiten más ingresos a la discoteca.</p>
                `;
            } else {
                // ENTRADA EXITOSA
                aforoActual++;
                ticketsUsados.push(code);
                localStorage.setItem('bunyar_aforo', aforoActual);
                localStorage.setItem('bunyar_tickets', JSON.stringify(ticketsUsados));

                const esVip = zone === 'VIP';

                resultBox.className = "result-screen screen-success";
                statusTitle.style.color = "var(--success-green)";
                statusTitle.innerText = "✅ ENTRADA ADMITIDA";

                infoDetails.innerHTML = `
                    <p><strong>Asistente:</strong> ${name}</p>
                    <p><strong>DNI:</strong> ${dni}</p>
                    <p><strong>Zona:</strong> ${esVip ? '✨ VIP GOLD' : '🍹 NORMAL'}</p>
                    <p><strong>Código:</strong> ${code}</p>
                    
                    <div class="aforo-badge">
                        Ingreso Registrado: ${aforoActual} de ${AFORO_MAXIMO}
                    </div>
                `;
            }
        } else {
            // QR Inválido o lectura directa
            resultBox.className = "result-screen screen-error";
            statusTitle.style.color = "var(--danger-red)";
            statusTitle.innerText = "❌ CÓDIGO NO VÁLIDO";
            infoDetails.innerHTML = "<p>El código escaneado no corresponde a una entrada activa de Bunyar.</p>";
        }
    </script>
</body>
</html>
