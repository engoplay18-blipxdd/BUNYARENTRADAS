<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNYAR - Control de Acceso</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --accent-neon: #00ff88;
            --danger-color: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        header { width: 100%; max-width: 500px; text-align: center; padding: 15px 0; border-bottom: 2px solid #2d3748; margin-bottom: 15px; }
        header h1 { font-size: 1.8rem; letter-spacing: 2px; color: var(--accent-neon); text-transform: uppercase; }
        
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        .capacity-card { background: var(--card-bg); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #2d3748; }
        .capacity-number { font-size: 2.5rem; font-weight: 800; color: var(--accent-neon); margin: 5px 0; }
        
        .result-card { display: none; border-radius: 15px; padding: 25px; text-align: center; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .status-admitted { background: #004d25; border: 3px solid var(--accent-neon); box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); }
        .status-denied { background: #4d0011; border: 3px solid var(--danger-color); box-shadow: 0 0 30px rgba(255, 51, 102, 0.4); }

        .status-icon { font-size: 4rem; margin-bottom: 10px; }
        .status-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .ticket-details { background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 12px; text-align: left; font-size: 0.95rem; line-height: 1.6; }
        
        .btn-reset { width: 100%; background: #ffffff; color: #000; border: none; padding: 14px; margin-top: 15px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-clear { background: #2d3748; color: #a0aec0; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>BUNYAR DISCOTECA</h1>
        <p>VALIDACIÓN DE ENTRADAS</p>
    </header>

    <div class="container">
        <!-- Control de Aforo -->
        <div class="capacity-card">
            <div style="font-size: 0.85rem; color: var(--text-secondary);">AFORO ACTUAL</div>
            <div class="capacity-number" id="capacityCount">0 / 135</div>
            <button class="btn-clear" onclick="clearUsedTickets()">🔄 Reiniciar Historial de Ingresos</button>
        </div>

        <!-- Pantalla de Resultado -->
        <div id="resultBox" class="result-card">
            <div id="statusIcon" class="status-icon">✅</div>
            <div id="statusTitle" class="status-title">ENTRADA ADMITIDA</div>
            
            <div class="ticket-details">
                <p><strong>DNI:</strong> <span id="resDNI">-</span></p>
                <p><strong>Nombres:</strong> <span id="resName">-</span></p>
                <p><strong>Tipo:</strong> <span id="resType">-</span></p>
                <p><strong>Estado:</strong> <span id="resMessage">-</span></p>
            </div>

            <button class="btn-reset" onclick="resetScanner()">Siguiente Cliente 🔄</button>
        </div>

        <!-- Escáner Cámara -->
        <div class="scanner-card" id="scannerCard" style="background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center;">
            <div id="reader"></div>
        </div>
    </div>

    <script>
        let capacity = parseInt(localStorage.getItem('bunyar_capacity')) || 0;
        let usedTickets = JSON.parse(localStorage.getItem('bunyar_used_tickets')) || [];
        const maxCapacity = 135;

        function updateCapacityDisplay() {
            document.getElementById('capacityCount').innerText = `${capacity} / ${maxCapacity}`;
            localStorage.setItem('bunyar_capacity', capacity);
        }

        function processTicket(ticketData) {
            const resultBox = document.getElementById('resultBox');
            const scannerCard = document.getElementById('scannerCard');
            
            scannerCard.style.display = 'none';
            resultBox.style.display = 'block';

            const urlParams = new URLSearchParams(ticketData);
            const dni = urlParams.get('dni') || '12345678';
            const nombre = urlParams.get('nombre') || 'Cliente';
            const tipo = urlParams.get('tipo') || 'NORMAL';

            // Identificador único para la entrada
            const ticketID = dni; 

            // Verificar si la entrada ya fue escaneada previamente
            if (usedTickets.includes(ticketID)) {
                // ENTRADA RECHAZADA POR DUPLICADA
                resultBox.className = 'result-card status-denied';
                document.getElementById('statusIcon').innerText = '❌';
                document.getElementById('statusTitle').innerText = 'ENTRADA RECHAZADA';
                document.getElementById('resDNI').innerText = dni;
                document.getElementById('resName').innerText = nombre;
                document.getElementById('resType').innerText = tipo;
                document.getElementById('resMessage').innerText = '⚠️ YA FUE USADA ANTERIORMENTE';
            } else {
                // ENTRADA VÁLIDA
                usedTickets.push(ticketID);
                localStorage.setItem('bunyar_used_tickets', JSON.stringify(usedTickets));

                capacity = Math.min(maxCapacity, capacity + 1);
                updateCapacityDisplay();

                resultBox.className = 'result-card status-admitted';
                document.getElementById('statusIcon').innerText = '✅';
                document.getElementById('statusTitle').innerText = 'ENTRADA ADMITIDA';
                document.getElementById('resDNI').innerText = dni;
                document.getElementById('resName').innerText = nombre;
                document.getElementById('resType').innerText = tipo;
                document.getElementById('resMessage').innerText = 'Acceso Permitido';
            }
        }

        function resetScanner() {
            window.location.href = 'admin.html';
        }

        function clearUsedTickets() {
            if (confirm("¿Deseas borrar el registro de entradas usadas y reiniciar el aforo a 0?")) {
                localStorage.removeItem('bunyar_used_tickets');
                localStorage.setItem('bunyar_capacity', 0);
                capacity = 0;
                usedTickets = [];
                updateCapacityDisplay();
                alert("Historial reiniciado.");
            }
        }

        window.onload = function() {
            updateCapacityDisplay();

            if (window.location.search) {
                processTicket(window.location.search);
            } else {
                let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
                html5QrcodeScanner.render((decodedText) => {
                    processTicket(decodedText);
                });
            }
        };
    </script>
</body>
</html>
