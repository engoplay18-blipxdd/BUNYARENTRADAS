<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISCOTECA BUNYAR 🌴🍹 - Comprar Entrada</title>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: #14161d;
            --accent-gold: #ffd700;
            --accent-gold-dark: #b8860b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            max-width: 160px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.8em;
            margin: 12px 0 5px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .subtitle {
            color: #aaa;
            font-size: 0.9em;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #272a36;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #d1d5db;
            font-size: 0.95em;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #333848;
            background: #1c1f2a;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }

        .status-text {
            font-size: 0.8em;
            color: var(--accent-gold);
            margin-top: 5px;
            display: none;
        }

        .error-text {
            font-size: 0.85em;
            color: #ff4d4d;
            margin-top: 5px;
            display: none;
            font-weight: bold;
        }

        .price-tag {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 20px 0;
            text-align: center;
        }

        .btn-buy {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #181b24;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            border: 1px solid var(--accent-gold);
        }

        #payment-qr {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        #ticket-container {
            margin-top: 30px;
            width: 100%;
            max-width: 440px;
        }

        .ticket-card {
            border-radius: 18px;
            padding: 25px;
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .ticket-normal {
            background: #1c1f2a;
            border: 2px solid #3d4254;
        }

        .ticket-vip {
            background: linear-gradient(135deg, #1f1a0a 0%, #3a2e0a 50%, #120f05 100%);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }

        .ticket-vip::before {
            content: "VIP GOLD 🌴";
            position: absolute;
            top: 15px;
            right: -32px;
            background: var(--accent-gold);
            color: #000;
            font-weight: 800;
            font-size: 10px;
            padding: 5px 32px;
            transform: rotate(45deg);
        }

        .qr-wrapper {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <img src="image_082d22.jpg" alt="Bunyar Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>DISCOTECA BUNYAR 🌴🍹</h1>
        <p class="subtitle">VENTA DE ENTRADAS OFICIAL 🔥</p>
    </div>

    <div class="container">
        <form id="ticketForm">
            <div class="form-group">
                <label>DNI / Documento (8 dígitos):</label>
                <input type="text" id="dni" placeholder="Ej. 76543210" maxlength="8" required oninput="consultarDNI()">
                <div id="statusDni" class="status-text">🔍 Consultando...</div>
            </div>

            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group">
                <label>Fecha de Nacimiento (+18):</label>
                <input type="date" id="fechaNacimiento" required onchange="validarEdad()">
                <div id="errorEdad" class="error-text">⛔ Debes ser mayor de 18 años para ingresar a Bunyar.</div>
            </div>

            <div class="form-group">
                <label>Selecciona tu Zona:</label>
                <select id="zona" onchange="actualizarPrecio()">
                    <option value="normal">🍹 Zona Normal - S/ 10.00</option>
                    <option value="vip">✨ Zona VIP Premium - S/ 20.00</option>
                </select>
            </div>

            <div class="price-tag" id="precioDisplay">Total a pagar: S/ 10.00</div>

            <button type="submit" id="btnPagar" class="btn-buy">COMPRAR ENTRADA CON QR</button>
        </form>
    </div>

    <!-- Modal Pago -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-gold); margin-top:0;">ESCANEAR PARA PAGAR 💸</h3>
            <p style="font-size: 0.85em; color: #ccc;">Pagos con Yape / Plin / BCP</p>
            <div id="payment-qr"></div>
            <p id="paymentAmount" style="font-weight: bold; color: #00ff88; font-size: 1.2em;"></p>
            <button class="btn-buy" onclick="confirmarPago()">SIMULAR PAGO EXITOSO</button>
        </div>
    </div>

    <div id="ticket-container"></div>

    <script>
        let datosEntradaTemp = {};
        let esMayorDeEdad = false;

        function actualizarPrecio() {
            const zona = document.getElementById('zona').value;
            document.getElementById('precioDisplay').innerText = zona === 'normal' ? 'Total a pagar: S/ 10.00' : 'Total a pagar: S/ 20.00';
        }

        async function consultarDNI() {
            const dni = document.getElementById('dni').value;
            const statusText = document.getElementById('statusDni');
            const nombreInput = document.getElementById('nombre');

            if (dni.length === 8) {
                statusText.style.display = 'block';
                statusText.innerText = '🔍 Consultando...';
                try {
                    const response = await fetch(`https://dniruc.apisperu.com/api/v1/dni/${dni}?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.nombres) {
                            nombreInput.value = `${data.nombres} ${data.apellidoPaterno} ${data.apellidoMaterno}`;
                            statusText.innerText = '✅ Nombre cargado automáticamente.';
                        } else { statusText.innerText = '💡 Escribe tu nombre manualmente.'; }
                    } else { statusText.innerText = '💡 Escribe tu nombre manualmente.'; }
                } catch (error) { statusText.innerText = '💡 Escribe tu nombre manualmente.'; }
            } else { statusText.style.display = 'none'; }
        }

        function validarEdad() {
            const fechaNacStr = document.getElementById('fechaNacimiento').value;
            if(!fechaNacStr) return;

            const fechaNac = new Date(fechaNacStr);
            const hoy = new Date();
            let edad = hoy.getFullYear() - fechaNac.getFullYear();
            const mes = hoy.getMonth() - fechaNac.getMonth();

            if (mes < 0 || (mes === 0 && hoy.getDate() < fechaNac.getDate())) edad--;

            const errorEdad = document.getElementById('errorEdad');
            const btnPagar = document.getElementById('btnPagar');

            if (edad >= 18) {
                errorEdad.style.display = 'none';
                btnPagar.disabled = false;
                btnPagar.style.opacity = '1';
                esMayorDeEdad = true;
            } else {
                errorEdad.style.display = 'block';
                btnPagar.disabled = true;
                btnPagar.style.opacity = '0.5';
                esMayorDeEdad = false;
            }
        }

        document.getElementById('ticketForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!esMayorDeEdad) { alert("Debes ser mayor de 18 años para ingresar."); return; }

            const nombre = document.getElementById('nombre').value;
            const dni = document.getElementById('dni').value;
            const zona = document.getElementById('zona').value;
            const precio = zona === 'normal' ? 10 : 20;

            datosEntradaTemp = { nombre, dni, zona, precio };

            document.getElementById('paymentAmount').innerText = `Monto: S/ ${precio}.00`;
            const paymentQrDiv = document.getElementById('payment-qr');
            paymentQrDiv.innerHTML = "";

            new QRCode(paymentQrDiv, { text: `PAGO_BUNYAR_${precio}_${dni}`, width: 140, height: 140 });
            document.getElementById('paymentModal').style.display = 'flex';
        });

        function confirmarPago() {
            document.getElementById('paymentModal').style.display = 'none';
            const container = document.getElementById('ticket-container');
            container.innerHTML = "";

            const esVip = datosEntradaTemp.zona === 'vip';
            const ticketDiv = document.createElement('div');
            ticketDiv.className = `ticket-card ${esVip ? 'ticket-vip' : 'ticket-normal'}`;

            const codigoUnico = 'BUNYAR-' + Math.floor(100000 + Math.random() * 900000);

            ticketDiv.innerHTML = `
                <h2 style="margin:0; color: ${esVip ? 'var(--accent-gold)' : '#fff'};">
                    ${esVip ? '✨ ENTRADA VIP ✨' : '🍹 ENTRADA GENERAL'}
                </h2>
                <small style="color:#aaa;">DISCOTECA BUNYAR 🌴</small>
                
                <div style="text-align: left; margin-top: 15px; font-size: 0.95em;">
                    <p style="margin: 5px 0;"><strong>Asistente:</strong> ${datosEntradaTemp.nombre}</p>
                    <p style="margin: 5px 0;"><strong>DNI:</strong> ${datosEntradaTemp.dni}</p>
                    <p style="margin: 5px 0;"><strong>Zona:</strong> ${esVip ? 'VIP GOLD' : 'Zona Normal'}</p>
                    <p style="margin: 5px 0;"><strong>Código:</strong> ${codigoUnico}</p>
                </div>

                <div class="qr-wrapper">
                    <div id="access-qr"></div>
                </div>
                <p style="font-size: 0.8em; margin-top: 10px; opacity: 0.8;">Escanea este QR con cualquier celular para validar el ingreso 📲</p>
            `;

            container.appendChild(ticketDiv);

            // Obtener la URL base para generar la redirección automática
            const baseURL = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            
            // Construir enlace directo que cualquier celular puede abrir
            const redirectURL = `${baseURL}/admin.html?code=${codigoUnico}&name=${encodeURIComponent(datosEntradaTemp.nombre)}&dni=${datosEntradaTemp.dni}&zone=${datosEntradaTemp.zona.toUpperCase()}`;

            new QRCode(ticketDiv.querySelector('#access-qr'), {
                text: redirectURL,
                width: 150,
                height: 150
            });

            ticketDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
