<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNYAR - Compra de Entradas</title>
    <!-- Librería para generar Código QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f30;
            --accent-neon: #00ff88;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #2d3748;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-neon);
        }

        .btn-search {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #1d4ed8;
        }

        .btn-buy {
            width: 100%;
            background: var(--accent-neon);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-buy:active {
            opacity: 0.9;
        }

        #qrContainer {
            display: none;
            margin-top: 25px;
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .qr-info {
            color: #000;
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>BUNYAR DISCOTECA</h1>
        <p style="color: var(--text-secondary);">Generador Oficial de Entradas QR</p>
    </header>

    <div class="card">
        <form id="ticketForm" onsubmit="generarEntrada(event)">
            <!-- DNI con Botón de Búsqueda RENIEC -->
            <div class="form-group">
                <label for="inputDNI">DNI del Cliente</label>
                <div class="input-group">
                    <input type="text" id="inputDNI" placeholder="Ej: 71234567" maxlength="8" required>
                    <button type="button" class="btn-search" onclick="buscarDNI()">Buscar 🔍</button>
                </div>
            </div>

            <!-- Nombre Completo (Autocompletado) -->
            <div class="form-group">
                <label for="inputNombre">Nombre Completo (RENIEC)</label>
                <input type="text" id="inputNombre" placeholder="Se completará automáticamente" required>
            </div>

            <!-- Tipo de Entrada (VIP / General) -->
            <div class="form-group">
                <label for="selectTipo">Tipo de Entrada</label>
                <select id="selectTipo" required>
                    <option value="ENTRADA GENERAL">ENTRADA GENERAL</option>
                    <option value="ENTRADA VIP">ENTRADA VIP</option>
                </select>
            </div>

            <button type="submit" class="btn-buy">Generar Entrada QR 🎫</button>
        </form>

        <!-- Contenedor del QR Generado -->
        <div id="qrContainer">
            <div id="qrcode"></div>
            <div class="qr-info" id="qrInfo"></div>
            <p style="color: #666; font-size: 0.8rem; margin-top: 5px;">Muestra este código QR en la entrada de la discoteca</p>
        </div>
    </div>

    <script>
        const API_TOKEN = "25516|PPkQb3BQYngHh5IH4Rjdo8sI5AlvvvRoXEtMwC8F97b86433";

        // Función para consultar RENIEC desde apiperu.dev
        async function buscarDNI() {
            const dni = document.getElementById('inputDNI').value.trim();
            
            if (dni.length !== 8 || isNaN(dni)) {
                alert("Por favor, ingresa un número de DNI válido de 8 dígitos.");
                return;
            }

            const nombreInput = document.getElementById('inputNombre');
            nombreInput.value = "Consultando a RENIEC...";

            try {
                const response = await fetch("https://apiperu.dev/api/dni", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({ dni: dni })
                });

                const data = await response.json();

                if (data.success) {
                    const nombreCompleto = `${data.data.nombres} ${data.data.apellido_paterno} ${data.data.apellido_materno}`;
                    nombreInput.value = nombreCompleto;
                } else {
                    alert("DNI no encontrado en la base de datos de RENIEC.");
                    nombreInput.value = "";
                }
            } catch (error) {
                console.error("Error al consultar la API:", error);
                alert("Ocurrió un error al conectar con la API de DNI.");
                nombreInput.value = "";
            }
        }

        // Función para generar la entrada y el QR
        function generarEntrada(event) {
            event.preventDefault();

            const dni = document.getElementById('inputDNI').value.trim();
            const nombre = document.getElementById('inputNombre').value.trim();
            const tipo = document.getElementById('selectTipo').value;

            if (!dni || !nombre) {
                alert("Completa todos los campos primero.");
                return;
            }

            // Construcción de la URL de validación hacia la página admin.html
            const urlAdmin = `https://engoplay18-blipxdd.github.io/BUNYARENTRADAS/admin.html?dni=${encodeURIComponent(dni)}&nombre=${encodeURIComponent(nombre)}&tipo=${encodeURIComponent(tipo)}`;

            // Limpiar QR anterior si existía
            document.getElementById('qrcode').innerHTML = "";

            // Generar nuevo código QR
            new QRCode(document.getElementById("qrcode"), {
                text: urlAdmin,
                width: 220,
                height: 220
            });

            // Mostrar resultados en pantalla
            document.getElementById('qrInfo').innerHTML = `
                <div>${nombre}</div>
                <div style="color: #2563eb; margin-top: 5px;">${tipo}</div>
                <div style="font-size: 0.85rem; color: #555;">DNI: ${dni}</div>
            `;
            document.getElementById('qrContainer').style.display = 'block';
        }
    </script>
</body>
</html>
