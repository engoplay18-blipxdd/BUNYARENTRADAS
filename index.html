<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNYAR DISCOTECA - Entradas VIP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(22, 31, 48, 0.85);
            --accent-neon: #00ff88;
            --accent-purple: #7928ca;
            --accent-blue: #0070f3;
            --yape-color: #742284;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1a0b2e 0%, var(--bg-color) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.8s ease;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }

        .input-group { display: flex; gap: 8px; }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2d3748;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        .btn-search {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .price-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-neon);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .price-amount { font-size: 1.3rem; color: var(--accent-neon); }

        .btn-pay-modal {
            width: 100%;
            background: linear-gradient(135deg, #00ff88, #00b8d4);
            color: #000;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: #1e1b2e;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 2px solid var(--yape-color);
            animation: popIn 0.3s ease;
        }

        .yape-header {
            background: var(--yape-color);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 900;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .fake-qr-payment {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
        }

        .btn-confirm-pay {
            width: 100%;
            background: var(--yape-color);
            color: #fff;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1rem;
        }

        #qrContainer {
            display: none;
            margin-top: 10px;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 16px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #qrcode { display: flex; justify-content: center; margin-bottom: 15px; }
        .qr-info { color: #0f172a; }
        .qr-info .name { font-size: 1.1rem; font-weight: 800; }
        .qr-info .badge {
            display: inline-block; background: #0f172a; color: var(--accent-neon);
            padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin: 6px 0;
        }

        .btn-reset-form {
            width: 100%;
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">🔥 BUNYAR 🍸</div>
        <p>Sistema Oficial de Entradas & Reservas VIP</p>
    </header>

    <div class="card">
        <form id="ticketForm" onsubmit="abrirPasarelaPago(event)">
            <div class="form-group">
                <label for="inputDNI">🪪 DNI del Cliente</label>
                <div class="input-group">
                    <input type="text" id="inputDNI" placeholder="Ej: 71234567" maxlength="8" required>
                    <button type="button" class="btn-search" id="btnSearch" onclick="buscarDNI()">Buscar 🔍</button>
                </div>
            </div>

            <div class="form-group">
                <label for="inputNombre">👤 Nombre Completo (RENIEC)</label>
                <input type="text" id="inputNombre" placeholder="Esperando DNI..." required readonly>
            </div>

            <div class="form-group">
                <label for="selectTipo">🎫 Zona & Entrada</label>
                <select id="selectTipo" onchange="actualizarPrecio()" required>
                    <option value="ENTRADA GENERAL">🎟️ ENTRADA GENERAL</option>
                    <option value="ENTRADA VIP">👑 ENTRADA VIP</option>
                </select>
            </div>

            <div class="price-badge">
                <span>Total a Pagar:</span>
                <span class="price-amount" id="priceDisplay">S/ 10.00</span>
            </div>

            <button type="submit" class="btn-pay-modal">Continuar al Pago 💳</button>
        </form>

        <div id="qrContainer">
            <div id="qrcode"></div>
            <div class="qr-info" id="qrInfo"></div>
            <p style="color: #64748b; font-size: 0.75rem; margin-top: 10px; border-top: 1px solid #e2e8f0; padding-top: 8px;">
                Muestra este código al personal de seguridad en puerta 🚪
            </p>
            <button class="btn-reset-form" onclick="comprarOtraEntrada()">🔄 Comprar Otra Entrada</button>
        </div>
    </div>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <div class="yape-header">📱 PASARELA YAPE / PLIN</div>
            <p style="font-size: 0.85rem; color: #ccc;">Escanea y yapea el monto exacto para liberar tu entrada:</p>
            
            <div style="font-size: 1.5rem; font-weight: 800; color: var(--accent-neon); margin-top: 8px;" id="payAmountModal">
                S/ 10.00
            </div>

            <div class="fake-qr-payment">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YAPE_BUNYAR_OFFICIAL_PAY" alt="QR Yape" width="150" height="150">
            </div>

            <p style="font-size: 0.75rem; color: #a0aec0;">Titular: <strong>BUNYAR DISCO S.A.C.</strong></p>

            <div style="margin-top: 12px; text-align: left;">
                <label style="font-size: 0.75rem; color: #ccc;">Nº de Operación (Simulado):</label>
                <input type="text" id="inputOp" placeholder="Ej: 849201" maxlength="8" style="margin-top: 4px;">
            </div>

            <button class="btn-confirm-pay" onclick="procesarPagoSimulado()">Verificar Pago & Generar QR 🚀</button>
            <button type="button" onclick="cerrarModal()" style="background:transparent; border:none; color:#aaa; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        const API_TOKEN = "25516|PPkQb3BQYngHh5IH4Rjdo8sI5AlvvvRoXEtMwC8F97b86433";

        function actualizarPrecio() {
            const tipo = document.getElementById('selectTipo').value;
            const priceDisplay = document.getElementById('priceDisplay');
            if (tipo === 'ENTRADA VIP') {
                priceDisplay.innerText = 'S/ 20.00';
            } else {
                priceDisplay.innerText = 'S/ 10.00';
            }
        }

        async function buscarDNI() {
            const dni = document.getElementById('inputDNI').value.trim();
            const btn = document.getElementById('btnSearch');
            const nombreInput = document.getElementById('inputNombre');
            
            if (dni.length !== 8 || isNaN(dni)) {
                alert("Ingresa un DNI de 8 dígitos.");
                return;
            }

            btn.style.opacity = "0.6";
            nombreInput.value = "Consultando RENIEC...";

            try {
                const response = await fetch("https://apiperu.dev/api/dni", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_TOKEN}`
                    },
                    body: JSON.stringify({ dni: dni })
                });

                const data = await response.json();

                if (data.success) {
                    nombreInput.value = `${data.data.nombres} ${data.data.apellido_paterno} ${data.data.apellido_materno}`;
                } else {
                    alert("DNI no encontrado.");
                    nombreInput.value = "";
                }
            } catch (error) {
                alert("Error de conexión con la API.");
                nombreInput.value = "";
            } finally {
                btn.style.opacity = "1";
            }
        }

        function abrirPasarelaPago(event) {
            event.preventDefault();

            const dni = document.getElementById('inputDNI').value.trim();
            const nombre = document.getElementById('inputNombre').value.trim();

            if (!dni || !nombre) {
                alert("Por favor consulta y valida el DNI primero.");
                return;
            }

            const precioText = document.getElementById('priceDisplay').innerText;
            document.getElementById('payAmountModal').innerText = precioText;
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function procesarPagoSimulado() {
            const numOp = document.getElementById('inputOp').value.trim();
            
            if (!numOp) {
                alert("Por favor ingresa un número de operación.");
                return;
            }

            cerrarModal();

            const dni = document.getElementById('inputDNI').value.trim();
            const nombre = document.getElementById('inputNombre').value.trim();
            const tipo = document.getElementById('selectTipo').value;
            const precioText = document.getElementById('priceDisplay').innerText;

            // Genera ID ÚNICO por cada compra para validar en el escáner
            const ticketUniqueId = Date.now();

            const urlAdmin = `https://engoplay18-blipxdd.github.io/BUNYARENTRADAS/admin.html?dni=${encodeURIComponent(dni)}&nombre=${encodeURIComponent(nombre)}&tipo=${encodeURIComponent(tipo)}&ticket_id=${ticketUniqueId}`;

            document.getElementById('qrcode').innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: urlAdmin,
                width: 200,
                height: 200
            });

            document.getElementById('qrInfo').innerHTML = `
                <div class="name">${nombre}</div>
                <div class="badge">${tipo}</div>
                <div style="font-size: 0.85rem; color: #475569; font-weight: bold;">Pago Confirmado (${precioText})</div>
                <div style="font-size: 0.75rem; color: #64748b;">DNI: ${dni} | Op: #${numOp}</div>
            `;
            
            document.getElementById('ticketForm').style.display = 'none';
            document.getElementById('qrContainer').style.display = 'block';
        }

        function comprarOtraEntrada() {
            document.getElementById('ticketForm').reset();
            document.getElementById('inputNombre').value = "";
            document.getElementById('priceDisplay').innerText = "S/ 10.00";
            document.getElementById('qrContainer').style.display = 'none';
            document.getElementById('ticketForm').style.display = 'block';
        }
    </script>
</body>
</html>
